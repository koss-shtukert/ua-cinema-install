<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Відкрити в UA Cinema</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111111;
      --surface: #1e1e1e;
      --text: #ffffff;
      --muted: #b8b8b8;
      --accent: #e50914;
      --line: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(229, 9, 20, 0.2), transparent 28rem),
        var(--bg);
      color: var(--text);
    }

    main {
      width: min(520px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      padding: 26px;
      box-shadow: 0 18px 70px rgba(0, 0, 0, 0.36);
    }

    .logo {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--accent);
      font-weight: 900;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.55;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    a, button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--accent);
      color: var(--text);
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }

    a.secondary {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--line);
    }

    .status {
      min-height: 22px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">UA</div>
    <h1>Відкрити в UA Cinema</h1>
    <p>
      Якщо додаток встановлений, посилання відкриється автоматично. Якщо ні,
      встанови останній APK і відкрий це посилання ще раз.
    </p>
    <div class="actions">
      <button id="openApp">Відкрити додаток</button>
      <a id="downloadApk" class="secondary" href="https://github.com/koss-shtukert/rd_flutter_project/releases/latest">
        Завантажити APK
      </a>
    </div>
    <div id="status" class="status">Готуємо deep link...</div>
  </main>

  <script>
    const updatesJsonUrl = 'https://pub-b9c840137f154243adcb0088e4afba66.r2.dev/updates.json';
    const fallbackReleaseUrl = 'https://github.com/koss-shtukert/rd_flutter_project/releases/latest';
    const params = new URLSearchParams(location.search);
    const pathParts = location.pathname.split('/').filter(Boolean);
    const id = params.get('id') || pathParts[pathParts.length - 1] || '';
    const appUrl = id ? `uacinema://share/${encodeURIComponent(id)}` : '';
    const statusEl = document.getElementById('status');
    const openEl = document.getElementById('openApp');
    const downloadEl = document.getElementById('downloadApk');

    function openApp() {
      if (!appUrl) {
        statusEl.textContent = 'Share id не знайдено в посиланні.';
        return;
      }

      statusEl.textContent = 'Відкриваємо додаток...';
      location.href = appUrl;
    }

    async function loadApkUrl() {
      try {
        const response = await fetch(updatesJsonUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        const apkUrl = data && data.android && data.android.apkUrl;
        if (!apkUrl) throw new Error('Missing APK URL');

        downloadEl.href = apkUrl;
      } catch (_) {
        downloadEl.href = fallbackReleaseUrl;
      }
    }

    openEl.addEventListener('click', openApp);
    loadApkUrl();
    setTimeout(openApp, 350);
  </script>
</body>
</html>
